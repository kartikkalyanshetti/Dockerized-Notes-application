services:

  db:
    image: postgres:16-alpine
    container_name: notes-db
    restart: unless-stopped
    mem_limit: 512m

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - backend-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  backend:

    image: kartik1160/notes-backend:1.0
    container_name: notes-backend
    restart: unless-stopped
    mem_limit: 256m

    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - frontend-net
      - backend-net


  frontend:

    image: kartik1160/notes-frontend:1.0
    container_name: notes-frontend
    restart: unless-stopped
    mem_limit: 128m

    ports:
      - "8080:8080"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - frontend-net

volumes:
  postgres-data:

networks:
  frontend-net:
  backend-net:
